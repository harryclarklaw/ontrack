name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests (pytest)
        run: python -m pytest

      - name: Smoke-test the CLI on the example SBOMs
        run: |
          sbom-counsel examples/clean.cdx.json -o /tmp/clean --as-of 2026-06-06 --gate
          sbom-counsel examples/mixed.spdx.json --exceptions examples/exceptions.yaml \
            -o /tmp/mixed --as-of 2026-06-06 || test $? -eq 1
