[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbom-counsel"
version = "0.1.0"
description = "Open-source licence-risk analysis for software bills of materials, written for a legal reader."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sbom-counsel contributors" }]
keywords = ["sbom", "licence", "license", "compliance", "cyclonedx", "spdx", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "license-expression>=30.0.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
sbom-counsel = "sbom_counsel.cli:main"

[project.urls]
Homepage = "https://github.com/harryclarklaw/ontrack"
Repository = "https://github.com/harryclarklaw/ontrack"
Changelog = "https://github.com/harryclarklaw/ontrack/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sbom_counsel"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
# E501: line length is handled by black. UP042: the (str, Enum) mix-in is a
# deliberate, well-understood pattern; we do not depend on StrEnum's str() change.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
files = ["src/sbom_counsel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
